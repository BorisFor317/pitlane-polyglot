services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: pitlane
      POSTGRES_PASSWORD: pitlane      # local dev only
      POSTGRES_DB: pitlane
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitlane"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
